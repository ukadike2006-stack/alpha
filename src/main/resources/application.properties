server.port=8080
spring.application.name=alpha-platform

# H2
spring.datasource.url=jdbc:h2:mem:alphadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PostgreSQL (commented out)
# spring.datasource.url=jdbc:postgresql://localhost:5432/alphadb
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

alpha.jwt.secret=YWxwaGFTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24yMDI2
alpha.jwt.expiration-ms=86400000

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
alpha.upload.dir=uploads/

logging.level.com.alpha=INFO
logging.level.org.springframework.security=WARN
