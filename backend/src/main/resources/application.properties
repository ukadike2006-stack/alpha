# ============================================================
#  ALPHA Platform — Application Configuration
#  All secrets are injected as environment variables.
#  Set these in Railway's dashboard (production) or .env (local).
# ============================================================

server.port=${PORT:8080}
spring.application.name=alpha-platform

# ── Database (PostgreSQL via Supabase or Railway) ─────────────
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:alphadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# H2 console (disable in production by setting H2_CONSOLE_ENABLED=false)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# ── JWT ───────────────────────────────────────────────────────
alpha.jwt.secret=${JWT_SECRET:YWxwaGFTZWNyZXRLZXlGb3JKV1RUb2tlbkdlbmVyYXRpb24yMDI2}
alpha.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS — set to your Vercel frontend URL in production ──────
alpha.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Redis (optional) ──────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── File Upload ───────────────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
alpha.upload.dir=${UPLOAD_DIR:uploads/}

# ── Logging ───────────────────────────────────────────────────
logging.level.com.alpha=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=WARN
